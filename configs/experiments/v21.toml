# Reduced rubric: six dimensions. target_visibility removed after the controlled occlusion study
# (with full level coverage the annotated dimension reached 0.128 of a possible 0.665 held-out R2).
# appearance_atypicality is retained but UNVALIDATED: calibration holds only 9 of 1500 images above
# level 2, so it cannot be adjudicated there, and it is reserved for the OOD evaluation where the
# construct has range. Not yet annotated or evaluated as a six-dimension prompt.
version = 21
split_config = "configs/splits.toml"

[evaluation]
iou_threshold = 0.5
compute_map = false
empty_union_score = 1.0

[inference]
transformer_confidence_threshold = 0.5

[rubric]
response_schema = "data/prompts/21/annotation_schema.json"
prompt_joint = "data/prompts/21/zero_shot_prompt_dimensions.txt"

[rubric.prompts_separate]
target_abundance = "data/prompts/21/zero_shot_prompt_target_abundance.txt"
target_scale = "data/prompts/21/zero_shot_prompt_target_scale.txt"
category_diversity = "data/prompts/21/zero_shot_prompt_category_diversity.txt"
instance_separation = "data/prompts/21/zero_shot_prompt_instance_separation.txt"
image_degradation = "data/prompts/21/zero_shot_prompt_image_degradation.txt"
appearance_atypicality = "data/prompts/21/zero_shot_prompt_appearance_atypicality.txt"

[rubric.target_categories]
coco-rem = "data/categories/coco.json"
coco-2017 = "data/categories/coco.json"
