[project]
name = "od-pred-rubrics"
version = "0.1.0"
description = "Research pipeline for object-detection capability and image-demand rubrics"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fiftyone (>=1.19.0,<2.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "numpy (>=1.26,<2)",
    "matplotlib (>=3.11.1,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "torch (>=2.13.0,<3.0.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "ultralytics (==8.3.0)",
    "transformers (>=5.14.1,<6.0.0)",
    "rfdetr (>=1.9.4,<2.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
